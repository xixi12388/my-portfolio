<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<div id="lightbox" onclick="closePhoto()">

    <button
        type="button"
        class="close-button"
        onclick="event.stopPropagation(); closePhoto()">
        ×
    </button>

    <button
        type="button"
        class="prev-button"
        onclick="event.stopPropagation(); changePhoto(-1)">
        ‹
    </button>

    <img
        id="lightbox-img"
        alt="放大的摄影作品"
        onclick="event.stopPropagation()">

<div
    class="lightbox-info"
    onclick="event.stopPropagation()">

    <p id="lightbox-title"></p>

    <p id="lightbox-counter"></p>

</div>

    <button
        type="button"
        class="next-button"
        onclick="event.stopPropagation(); changePhoto(1)">
        ›
    </button>

</div>

<script>
    let currentPhotoIndex = 0;

    function getGalleryPhotos() {
        return Array.from(document.querySelectorAll(".photos img"));
    }

    function updateLightbox() {
        const galleryPhotos = getGalleryPhotos();
        const currentPhoto = galleryPhotos[currentPhotoIndex];

        document.getElementById("lightbox-img").src =
            currentPhoto.src;

        document.getElementById("lightbox-title").textContent =
            currentPhoto.alt;

        document.getElementById("lightbox-counter").textContent =
            `${currentPhotoIndex + 1} / ${galleryPhotos.length}`;
    }

    function openPhoto(photo) {
        const galleryPhotos = getGalleryPhotos();

        currentPhotoIndex = galleryPhotos.indexOf(photo);

        updateLightbox();

        document.getElementById("lightbox").style.display = "flex";
    }

    function closePhoto() {
        document.getElementById("lightbox").style.display = "none";
    }

    function changePhoto(direction) {
        const galleryPhotos = getGalleryPhotos();

        if (galleryPhotos.length === 0) {
            return;
        }

        currentPhotoIndex += direction;

        if (currentPhotoIndex < 0) {
            currentPhotoIndex = galleryPhotos.length - 1;
        }

        if (currentPhotoIndex >= galleryPhotos.length) {
            currentPhotoIndex = 0;
        }

        updateLightbox();
    }

    document.addEventListener("keydown", function (event) {
        const lightbox = document.getElementById("lightbox");

        if (lightbox.style.display !== "flex") {
            return;
        }

        if (event.key === "Escape") {
            closePhoto();
        }

        if (event.key === "ArrowLeft") {
            changePhoto(-1);
        }

        if (event.key === "ArrowRight") {
            changePhoto(1);
        }
    });
</script>
